# CI: every push and pull request. The tests on Linux, Windows and macOS
# against Nexium's release, the sources checked for formatting, and the
# example bot checked. The tests talk to a scripted Discord, not the real
# one: no token, no network.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXIUM_VERSION: v1.4.0
  NX_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Londopy/nexium/.github/actions/setup-nexium@664f8ed46bd4c6b05c15cd665cedad51f9c60c34 # v1.4.0
        with:
          version: ${{ env.NEXIUM_VERSION }}

      - name: Fetch the dependencies
        shell: bash
        run: nx fetch

      - name: Tests
        shell: bash
        run: |
          for m in js gateway message interaction command event layer lib; do
            nx test src/$m.nx --out-dir nx-out/t-$m
          done

      - name: Formatting
        if: runner.os == 'Linux'
        run: nx fmt src/*.nx examples/pingbot/main.nx --check

      - name: The example bot checks
        shell: bash
        working-directory: examples/pingbot
        run: |
          nx fetch
          nx check main.nx
